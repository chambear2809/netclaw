testbed:
  name: NetClaw-Full-Topo
  credentials:
    default:
      username: "%ENV{NETCLAW_USERNAME}"
      password: "%ENV{NETCLAW_PASSWORD}"
    enable:
      password: "%ENV{NETCLAW_ENABLE_PASSWORD}"

devices:
  R1:
    alias: R1
    type: router
    os: iosxe
    platform: iol
    connections:
      defaults:
        class: unicon.Unicon
      ssh:
        protocol: ssh
        ip: 192.168.2.201
        port: 22
        ssh_options: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  R2:
    alias: R2
    type: router
    os: iosxe
    platform: iol
    connections:
      defaults:
        class: unicon.Unicon
      ssh:
        protocol: ssh
        ip: 192.168.2.202
        port: 22
        ssh_options: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  SW1:
    alias: SW1
    type: switch
    os: iosxe
    platform: iol
    connections:
      defaults:
        class: unicon.Unicon
      ssh:
        protocol: ssh
        ip: 192.168.2.211
        port: 22
        ssh_options: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  SW2:
    alias: SW2
    type: switch
    os: iosxe
    platform: iol
    connections:
      defaults:
        class: unicon.Unicon
      ssh:
        protocol: ssh
        ip: 192.168.2.212
        port: 22
        ssh_options: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
